# DigitalOcean App Platform spec — The Lede static marketing/legal site.
# Deploy:  doctl apps create --spec .do/app.yaml
# Update:  doctl apps update <APP_ID> --spec .do/app.yaml
#
# TODO: set github.repo to the real <owner>/<repo> once the repo is pushed.
name: the-lede-site
region: nyc
static_sites:
  - name: site
    github:
      repo: OWNER/the-lede-site   # <-- replace with your GitHub owner/repo
      branch: main
      deploy_on_push: true
    source_dir: /
    index_document: index.html
    error_document: 404.html
domains:
  - domain: theledeapp.com
    type: PRIMARY
  - domain: www.theledeapp.com
    type: ALIAS
