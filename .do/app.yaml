# DigitalOcean App Platform spec — The Lede static marketing/legal site.
# Deploy:  doctl apps create --spec .do/app.yaml
# Update:  doctl apps update <APP_ID> --spec .do/app.yaml
#
# GitHub-connected source with deploy_on_push: a push to `main` auto-redeploys.
# The DigitalOcean GitHub app is installed on cdklein/the-lede-site (linked
# 2026-06-20). If that link is ever removed, App Platform falls back to needing
# a manual `doctl apps create-deployment <APP_ID>`.
name: the-lede-site
region: nyc
static_sites:
  - name: site
    github:
      repo: cdklein/the-lede-site
      branch: main
      deploy_on_push: true
    source_dir: /
    index_document: index.html
    error_document: 404.html
# `zone:` puts these in DO-managed-DNS mode: App Platform creates + manages the
# apex ALIAS and the www CNAME in the theledeapp.com zone itself (an apex ALIAS
# can't be created by hand). Without `zone:`, App Platform sits in bring-your-own-DNS
# mode and only *verifies* records it expects you to have created — which leaves the
# zone empty and nothing resolving.
domains:
  - domain: theledeapp.com
    type: PRIMARY
    zone: theledeapp.com
  - domain: www.theledeapp.com
    type: ALIAS
    zone: theledeapp.com
