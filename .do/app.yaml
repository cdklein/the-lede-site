# DigitalOcean App Platform spec — The Lede static marketing/legal site.
# Deploy:  doctl apps create --spec .do/app.yaml
# Update:  doctl apps update <APP_ID> --spec .do/app.yaml
#
# Uses a public git source (no GitHub OAuth needed). To re-enable
# auto-deploy-on-push later, connect GitHub in the DO console once and swap
# this `git:` block for a `github: { repo, branch, deploy_on_push: true }` block.
name: the-lede-site
region: nyc
static_sites:
  - name: site
    git:
      repo_clone_url: https://github.com/cdklein/the-lede-site.git
      branch: main
    source_dir: /
    index_document: index.html
    error_document: 404.html
domains:
  - domain: theledeapp.com
    type: PRIMARY
  - domain: www.theledeapp.com
    type: ALIAS
