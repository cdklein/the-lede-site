# The outage notice Worker (ios#598). Deploy steps: RUNBOOK.md in this folder.
# Not part of the site deploy: deploy.sh stages named files only and never copies workers/.
name = "lede-desk-status"
main = "worker.js"
compatibility_date = "2026-09-01"

# Only the route below reaches it: no *.workers.dev address, no preview addresses.
workers_dev = false
preview_urls = false
# Logging off (design of record): no Logpush here, no Workers Logs below.
logpush = false

routes = [
  { pattern = "theledeapp.com/status/*", zone_name = "theledeapp.com" },
]

# The namespace `lede-desk-status`, created 2026-10-29 (RUNBOOK.md, step 1). The Worker
# reads the key "notice" from it.
[[kv_namespaces]]
binding = "STATUS"
id = "987d73e5103749d2999803117718c762"

[observability]
enabled = false
